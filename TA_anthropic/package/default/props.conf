[anthropic:api_keys]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
KV_MODE = json
TRUNCATE = 100000
# TIMESTAMP: the modular input stamps each event explicitly (smi.Event time=),
# so the settings below are the FALLBACK path only - they engage for a forwarded
# copy, a replayed file, or a oneshot of this sourcetype.
# They pin the time to snapshot_at (when the snapshot was taken), NOT created_at:
# the heuristic would otherwise pick created_at, which is months old, and
# back-date the snapshot out of the baseline window.
# TZ is load-bearing: TIME_FORMAT consumes the trailing "Z" as a literal
# character, not as a UTC designator, so no zone is derived from the event and
# Splunk would otherwise fall back to the indexer's local zone.
# TIMESTAMP_FIELDS is deliberately absent - props.conf.spec scopes it to
# Structured Data Header Extraction (INDEXED_EXTRACTIONS), which this
# search-time KV_MODE = json stanza never sets, so it would be inert here.
TIME_PREFIX = "snapshot_at"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 32
category = Structured
description = Anthropic organization API key inventory snapshots

