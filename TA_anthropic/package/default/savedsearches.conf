[Anthropic - Build API Key Baseline]
search = sourcetype=anthropic:api_keys | stats latest(name) as name latest(workspace_id) as workspace_id latest(status) as status by id | outputlookup override_if_empty=false anthropic_api_key_baseline.csv
description = Rebuilds the known-API-key baseline from the newest org directory snapshot. override_if_empty=false because outputlookup DELETES the lookup file when a run returns no rows; a -7d window plus that guard means one missed directory run cannot empty the baseline and unblank the shadow-AI panel.
cron_schedule = */30 * * * *
enableSched = 1
dispatch.earliest_time = -7d
dispatch.latest_time = now

[Anthropic - Unrecognized API Key]
search = sourcetype=anthropic:usage api_key_id=* | stats sum(total_input_tokens) as input_tokens sum(output_tokens) as output_tokens by api_key_id | lookup anthropic_api_key_baseline id as api_key_id OUTPUT name | where isnull(name)
description = Fires when a key that bills tokens is absent from the API key baseline lookup (shadow AI). The search is character-identical to the "Unrecognized API Keys (shadow AI)" dashboard panel and dispatch.earliest_time MUST stay -7d to match that panel's window. The mock anchors the rogue key's usage bucket one hour before the mock's boot hour, so a -24h window loses it 23h after the mock starts: stage the demo overnight and the panel would still show apikey_rogue_demo while the scheduled alert silently returned 0 rows.
cron_schedule = */5 * * * *
enableSched = 1
dispatch.earliest_time = -7d
dispatch.latest_time = now
alert.severity = 4
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0

[Anthropic - Token Spike Anomaly]
search = sourcetype=anthropic:usage | bin _time span=1h | stats sum(total_input_tokens) as tokens by _time | sort 0 _time | streamstats window=6 current=f avg(tokens) as baseline stdevp(tokens) as sd | where sd > 0 AND tokens > 2000000 AND tokens > baseline + 2*sd | eval baseline = round(baseline), sd = round(sd), spike_ratio = round(tokens / baseline, 2) | table _time tokens baseline sd spike_ratio
description = Fires on an hour whose input tokens clear an absolute floor of 2,000,000 AND exceed the mean of the 6 PRECEDING hours by more than 2 population standard deviations. current=f keeps the spiking hour out of its own baseline - with current=t the z-score of n buckets is capped at (n-1)/sqrt(n), so a 3-sigma test over a short window can never fire. Do NOT widen dispatch.earliest_time to match the -7d panels: unlike the shadow-AI alert this search has no dashboard panel to diverge from, and the window is load-bearing because it bounds how many mock re-anchor generations reach streamstats. One generation gives baseline 1,962,400 / sd 1,129,900, so the 4,976,800 spike clears the 4,222,200 threshold; a second generation in the window lifts the threshold to 5,711,831 and a third to 6,355,629, which 4,976,800 can never clear. -48h already outlives the >24h overnight staging gap that forced the shadow-AI alert to -7d.
cron_schedule = */15 * * * *
enableSched = 1
dispatch.earliest_time = -48h
dispatch.latest_time = now
alert.severity = 3
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0
