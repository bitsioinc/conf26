# TZ is load-bearing on every stanza below, even though only openrouter:keys'
# TIME_FORMAT ends in a literal Z. Neither TIME_FORMAT carries a UTC offset
# (%Y-%m-%d %H:%M:%S has none at all; %Y-%m-%dT%H:%M:%SZ treats the trailing
# Z as a literal character, not a UTC designator), so without TZ the indexer
# would apply its own local offset to every event.
#
# TIMESTAMP_FIELDS is deliberately absent: it only applies under
# INDEXED_EXTRACTIONS, and these stanzas use search-time KV_MODE = json, so it
# would be a no-op that invites someone to delete the lines below that do the
# actual work. The authoritative timestamp is the modular input's explicit
# event time; these props are the fallback.
#
# openrouter:analytics and openrouter:providers key off "bucket_start", which
# comes straight from the API's /analytics/query bucket column
# (date__hour / created_at__hour): space-separated and offset-free, e.g.
# "2026-07-31 12:00:00". openrouter:keys keys off "snapshot_at", which the
# add-on itself generates as RFC 3339, e.g. "2026-08-01T00:00:00Z" -- a
# genuinely different wire format, so it gets its own TIME_FORMAT.

[openrouter:analytics]
KV_MODE = json
TIME_PREFIX = "bucket_start":\s*"
TIME_FORMAT = %Y-%m-%d %H:%M:%S
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 30
SHOULD_LINEMERGE = false
category = Cloud
pulldown_type = 1

[openrouter:providers]
KV_MODE = json
TIME_PREFIX = "bucket_start":\s*"
TIME_FORMAT = %Y-%m-%d %H:%M:%S
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 30
SHOULD_LINEMERGE = false
category = Cloud
pulldown_type = 1

[openrouter:keys]
KV_MODE = json
TIME_PREFIX = "snapshot_at":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 30
SHOULD_LINEMERGE = false
category = Cloud
pulldown_type = 1
