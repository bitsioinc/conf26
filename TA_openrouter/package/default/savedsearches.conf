# Alert triggers use counttype/relation/quantity, not the REST API argument
# names (alert_type, alert_comparator, alert_threshold): those REST names are
# absent from savedsearches.conf.spec and `slim validate` rejects them.
#
# OpenRouter's /analytics/query endpoint was verified live (2026-07-31,
# see docs/schema-verification.md) to identify an API key by its
# human-readable *name* in the api_key_id field -- never by the roster's
# hash. `analytics api_key_id` intersected with `keys.name` recovered all 3
# sanctioned keys; intersected with `keys.hash` it was empty. Every search
# below that joins analytics traffic to the key roster is written
# accordingly: the baseline builder keys its output on name (not hash), and
# the lookup call in the unrecognised-key alert joins on api_key_id, which
# is a field openrouter:analytics actually emits.

[OpenRouter - Build API Key Baseline]
search = `openrouter_index` sourcetype=openrouter:keys \
 | stats min(_time) as first_seen by name \
 | eval api_key_id=name \
 | eval first_seen=strftime(first_seen,"%Y-%m-%dT%H:%M:%SZ") \
 | table api_key_id name first_seen \
 | outputlookup override_if_empty=false openrouter_key_baseline
description = Populates the sanctioned API key baseline (openrouter_key_baseline.csv) from the observed openrouter:keys roster, keyed by name rather than hash: OpenRouter's analytics endpoints identify a key by name in api_key_id and never expose the roster hash (verified against live data -- see docs/schema-verification.md), so api_key_id is set equal to name here to make that join actually match downstream. Consequence: renaming a key in OpenRouter changes its name, which changes the join key used by every alert below -- the renamed key will look unrecognised in analytics traffic until this search is re-run, and the old name's first_seen history is not carried forward to the new name. This is inherent to the API, which never exposes the hash in analytics responses, not a defect in this search. Run once from inside the TA_openrouter app after the keys input has collected, then re-run whenever keys are legitimately added or renamed. override_if_empty=false because outputlookup DELETES the lookup file when a run returns no rows: without this guard, a keys-input outage or index-latency race outliving this search's -7d window would return zero rows on re-run and silently delete a fully populated baseline. A deleted baseline makes the downstream `lookup openrouter_key_baseline` clause in OpenRouter - Unrecognised API Key Active fail the search outright (not merely return it empty), which permanently and silently kills that alert's trigger -- the same failure mode override_if_empty=false guards against in this repo's sibling TA_anthropic/package/default/savedsearches.conf.
dispatch.earliest_time = -7d
dispatch.latest_time = now
enableSched = 0
cron_schedule = 0 6 * * *

[OpenRouter - Unrecognised API Key Active]
search = `openrouter_index` sourcetype=openrouter:analytics \
 | stats sum(total_usage_usd) as spend_usd sum(request_count) as requests values(model) as models by api_key_id \
 | lookup openrouter_key_baseline api_key_id OUTPUT name as baseline_name \
 | where isnull(baseline_name) \
 | table api_key_id spend_usd requests models
description = An API key produced traffic in openrouter:analytics but its api_key_id (the key's name, per OpenRouter's analytics contract) has no match in the openrouter_key_baseline lookup, meaning it is absent from the sanctioned roster last captured by OpenRouter - Build API Key Baseline. Re-run the baseline builder after legitimately adding or renaming a key before treating a hit here as shadow usage. alert.suppress.fields=api_key_id plus alert.digest_mode=0 make the 6h suppression apply per api_key_id, matching README.md's "suppressed 6h per result": without alert.suppress.fields, suppress.period applies to the whole search (digest mode), so one noisy shadow key firing at 10:00 would suppress every other key's genuine unrecognised-key hit until 16:00, not just its own.
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
cron_schedule = 15 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 6h
alert.suppress.fields = api_key_id
alert.digest_mode = 0
alert.track = 1

[OpenRouter - Hourly Spend Spike by Key]
search = `openrouter_index` sourcetype=openrouter:analytics \
 | bin _time span=1h \
 | stats sum(total_usage_usd) as spend_usd by _time api_key_id \
 | sort 0 api_key_id _time \
 | streamstats window=6 current=f global=f avg(spend_usd) as trailing_avg stdev(spend_usd) as trailing_stdev by api_key_id \
 | where isnotnull(trailing_stdev) AND trailing_stdev>0 AND spend_usd > trailing_avg + 3*trailing_stdev \
 | where _time >= relative_time(now(), "-2h@h") \
 | eval spike_ratio=round(spend_usd/trailing_avg,2) \
 | table _time api_key_id spend_usd trailing_avg spike_ratio
description = Hourly spend for an API key (spend_usd, summed from openrouter:analytics' total_usage_usd) exceeded three standard deviations above its own six-hour trailing mean (streamstats window=6 current=f, so the current bucket never contaminates its own trailing baseline). Threshold pinned by tests/test_openrouter_alerts.py against the committed fixtures: sigma=3 isolates exactly Nimbus_Prod_Key's runaway final bucket, while sigma=0.5 would also flag Shadow_Intern_Key -- so 3 is not an arbitrarily loose trigger. The second `where`, appended after the spike test (never before it -- streamstats must still see the full history or the trailing baseline starves), restricts the *trigger set* to buckets from roughly the last 2 hours (relative_time(now(), "-2h@h")) so one spike is reported once per cron cycle instead of re-satisfying counttype=number of events/quantity=0 on every hourly run for the full 48h it used to remain inside the search window -- at cron_schedule=20 * * * * with alert.suppress.period=2h that was producing roughly 24 Triggered Alerts entries, all naming the same _time and api_key_id, for one incident. dispatch.earliest_time is narrowed from -48h to -9h: streamstats window=6 needs 6 complete buckets strictly before the oldest bucket the recency filter can still pass, and that oldest passable bucket can itself be up to 2h plus up to 1h of within-hour skew before dispatch time (relative_time floors to the top of the hour, so a dispatch near the end of an hour loses up to 59 minutes to that floor) -- 6+2+1=9h is the smallest round-hour window that keeps a full baseline in every case; -8h is exactly one hour short whenever dispatch falls late in the hour. alert.suppress.fields=api_key_id plus alert.digest_mode=0 make the 2h suppression apply per api_key_id (matching README.md's "suppressed 2h per result"), not per search run, so one key's spike cannot mask a second key's independent spike.
dispatch.earliest_time = -9h
dispatch.latest_time = now
enableSched = 1
cron_schedule = 20 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.suppress = 1
alert.suppress.period = 2h
alert.suppress.fields = api_key_id
alert.digest_mode = 0
alert.track = 1
